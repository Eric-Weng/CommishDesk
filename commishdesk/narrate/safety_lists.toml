# safety_lists.toml — deterministic content-safety pattern lists (AD-12, Story 3.4)
#
# Consumed by commishdesk/narrate/safety.py. Every entry is a Python regular
# expression, compiled case-insensitively (re.IGNORECASE) and matched against a
# single sentence of a narrator's output. Editing this file changes the checks
# in force WITHOUT a code change — that is the point (AD-12: "safety lists are
# version-controlled data files").
#
# How to edit:
#   * Use TOML *literal* strings (single quotes) so backslashes reach the regex
#     engine untouched — `'\bfoo\b'`, never `"\bfoo\b"` (a TOML basic string
#     would try to interpret `\b` / `\w` and fail to parse).
#   * Anchor word matches with `\b...\b` so "bet" does not fire inside "better".
#   * A pattern that does not compile raises NarratorError the first time a
#     recap is checked — run `uv run pytest tests/test_narrate_safety.py` after
#     any edit.
#   * `[banned_topics]` maps a category name to its pattern list. A hit in the
#     same sentence as a manager's name holds the whole Issue (`hold_issue`); a
#     hit with no name in that sentence only warns (`banned_topic`).
#   * `personal_insults` and `slop` are flat lists. A personal insult beside a
#     manager name also holds; slop only ever warns.
#   * A Voice's `banned_topics` prose is merged in on top of this file at
#     runtime as extracted keyword patterns under a `voice:<voice_id>` category
#     — it does not need to be copied here. Those voice keywords only ever warn,
#     never hold.
#
# Calibration rule: the hold tier fires next to a manager's name, so a pattern
# here must target abuse of a *person*, not language that roasts a *pick or an
# approach*. "reached for a kicker", "wasted the third-rounder", "took the
# injury-prone back", "a clueless approach from Marcus" must all pass. Ambiguous
# words (pathetic / clueless / incompetent / a drafted player's injury history)
# are therefore kept out of the bare lists or required to be person-directed.
#
# The same rule, re-applied after the Epic 3 retrospective (findings D2): a bare
# `gambl*`, a bare `charged with`, and `gut` in the possessive appearance pattern
# all fired on ordinary football prose — "gambling on upside", "charged with
# rebuilding the backfield", "went with his gut". Each is now either gone or
# required to carry its abusive object ("gambling problem", "charged with a
# felony"). These three sentences beside a manager's name must not hold.

personal_insults = [
  '\bidiot(s|ic)?\b',
  '\bmoron(s|ic)?\b',
  '\bstupid(ity)?\b',
  '\bdumb(ass|est)?\b',
  '\bbrain-?dead\b',
  '\bimbecile\b',
  '\bcan.?t read a (draft )?board\b',
  '\bwhat an idiot\b',
  '\bwhat an? (embarrassment|disgrace|joke|clown)\b',
  '\bhe.?s a (clown|joke|fraud|disgrace)\b',
  '\bshe.?s a (clown|joke|fraud|disgrace)\b',
  '\b(he|she|they|you)\b.{0,24}\b(pathetic|clueless|incompetent|incompetence|embarrassment|embarrassing)\b',
  '\bwaste of a (roster|seat|keyboard)\b',
]

# Recalibrated 2026-09-13: the original list below was mostly genuine, if
# tired, real sports-writing idiom ("make no mistake", "for the ages", "it is
# what it is", "game-changer" — columnists say these constantly, unironically)
# rather than a distinctive AI-generated tell. Punishing real columnist
# register the same way a hallucinated fact is punished was pure cost for no
# quality gain — every hit here discards the *entire* narration to the dry
# template (suppress_section), even when the only "problem" was authentic
# voice. This list instead targets phrasing that is disproportionately an LLM
# habit and essentially never appears in a beat writer's actual copy: vague
# corporate/expository throat-clearing, not color or hype.
slop = [
  '\bdelve(s|d)? into\b',
  '\ba testament to\b',
  '\btapestry\b',
  '\bunderscor(e|es|ed|ing)\b',
  '\bnavigate(s|d)? the\b',
  '\bthe (draft |fantasy )?landscape\b',
  '\bin the world of\b',
  '\bwhether you.?re a\b',
  '\bit.?s (worth noting|important to note) that\b',
  '\bin conclusion\b',
  '\bunlocks? (his|her|their|its) (full )?(potential|upside|ceiling)\b',
  '\belevate[sd]? (their|the|his|her) (game|roster|floor|ceiling)\b',
  '\ba rollercoaster of emotions\b',
]

# Which [banned_topics] categories escalate to a whole-Issue HOLD when a
# manager's name shares the sentence. A category left out of this list still
# warns (and the repair tier excises the sentence) -- it just never withholds
# the Issue.
#
# The line is "is this abuse of, or drama about, a PERSON in this league?" —
# which is the actual editorial policy: no politics, no insulting managers,
# nothing that stirs drama past the fantasy football.
#
# `injury_medical` is deliberately ABSENT. A player getting hurt is not abuse of
# a manager, and it is frequently the causal heart of a fantasy week: "the
# Gazelles lost their back in the second quarter and the week went with him" is
# the ordinary shape of a weekly recap sentence, not a safety incident. Holding
# an Issue over it would make the newsletter unable to explain its own results.
# Medical *specifics* (surgery, a torn ligament, someone's injury history) still
# warn and still get excised — the event is fair game, the medical file is not.
#
# `gambling` is also absent: an errant betting metaphor ("that opening parlay at
# picks 2 and 3") is a tone slip worth removing, not grounds for withholding an
# Issue from twelve people.
escalate_to_hold = [
  "personal_life",
  "appearance",
  "substances",
  "legal",
  "politics_religion",
  "gambling_personal",
]

[banned_topics]
# Narrow, phrase-based — no bare "injured" / "injury", which fire on legitimate
# scouting talk about a pick ("took the injury-prone back").
injury_medical = [
  '\binjury history\b',
  '\bmedical (status|history|records?)\b',
  '\bconcussion\b',
  '\btorn (acl|mcl|labrum|achilles)\b',
  '\bhamstring (injury|strain|issue)\b',
  '\bsurgery\b',
  '\bcarted off\b',
  '\bwheelchair\b',
  '\bhealth scare\b',
]
legal = [
  '\barrest(ed|s)?\b',
  '\bindict(ed|ment)\b',
  # Requires a crime object: "charged with a felony" is abuse of a person,
  # "charged with rebuilding the backfield" is ordinary football prose.
  # The object list is wide on purpose — a handful of nouns silently dropped
  # "charged with murder" / "theft" / "robbery" / "two felonies".
  '\bcharged with (a |an |the |two |three |several |multiple )?(felon(y|ies)|misdemeanou?rs?|crimes?|murder|homicide|manslaughter|assaults?|batter(y|ies)|dui|dwi|possession|fraud|theft|robbery|burglary|drugs?|weapons?|domestic (violence|abuse|assault))\b',
  '\blawsuit\b',
  '\bcourt (date|case|appearance)\b',
  '\bprobation\b',
  '\bfelony\b',
  '\bmisdemeanor\b',
  '\bdui\b',
  '\bdomestic (violence|dispute|abuse)\b',
  '\blegal trouble\b',
]
personal_life = [
  '\bdivorce\w*',
  '\bgirlfriend\b',
  '\bboyfriend\b',
  '\b(his|her|their) (wife|husband|marriage|kids?|children)\b',
  '\bfamily life\b',
  '\bpersonal life\b',
  '\bbaby mama\b',
  '\bcustody battle\b',
  '\bmessy breakup\b',
]
appearance = [
  '\boverweight\b',
  '\bout of shape\b',
  '\bdad bod\b',
  '\bbody fat\b',
  '\bobese\b',
  '\bbald(ing)?\b',
  '\b(he|she|they) (is|are|looks?) (fat|ugly|hideous)\b',
  # No "gut": "went with his gut" is a draft-approach idiom, not a body comment.
  # "weight" needed the same treatment, live-confirmed 2026-09-13 (P0.1
  # validation run): "putting their weight behind three tailbacks" is an idiom
  # about commitment, not a comment on a body, and the bare possessive
  # suppressed an otherwise-clean Issue. A real body comment names the body.
  '\b(his|her|their) physique\b',
  '\b(his|her|their) (weight|size) (problem|issue)\b',
  '\b(lost|gained) (a lot of |some )?weight\b',
  '\bcarrying (extra |too much |the )?weight (around|in the)\b',
]
politics_religion = [
  '\bpolitic(s|al|ians?)\b',
  '\breligio(n|us)\b',
  '\bnationalit(y|ies)\b',
  '\bimmigrat(ion|e|ed)\b',
  '\bpartisan\b',
  '\b(democrat|republican)s?\b',
  '\b(left|right)-wing\b',
  '\bchurch-?going\b',
]
# Market/wagering FRAMING applied to picks. A tone slip, not an accusation —
# non-escalating, so a stray "opening parlay at picks 2 and 3" gets its sentence
# excised rather than withholding the Issue from twelve people.
gambling = [
  '\bthe (betting )?line on\b',
  '\bpoint spread\b',
  '\bmoneyline\b',
  '\bover/under\b',
  '\bparlay\b',
  '\bprop bet\b',
  '\bvegas (has|likes?|line)\b',
]
# Wagering as a claim about a PERSON. This one escalates: it is precisely the
# drama-past-the-football the policy exists to stop.
#
# No bare "gambl*" — "gambling on upside" describes a pick, not a person. But
# the noun and the third-person verb are *only* ever about the person, so they
# stay: "a degenerate gambler", "he gambles every week".
gambling_personal = [
  # These name actual betting activity, not an odds metaphor about a pick:
  # "Marcus basically runs a sportsbook" is an accusation.
  '\bsportsbook\b',
  '\bwager(s|ing|ed)?\b',
  '\b(draftkings|fanduel)\b',
  '\bbetting (line|odds|advice)\b',
  '\bgambling (problem|addiction|debts?|advice)\b',
  '\bgamblers?\b',
  '\bgambles\b',
]
substances = [
  '\bhungover\b',
  '\b(drafted|drafting|picking|picked) (while )?drunk\b',
  '\bshowed up (drunk|hammered|wasted)\b',
  '\bstoned\b',
  '\bhigh as a kite\b',
  '\bcocaine\b',
  '\bmarijuana\b',
  '\bdrinking problem\b',
  '\bsubstance (abuse|problem)\b',
  '\bin rehab\b',
  '\bpopping pills\b',
]

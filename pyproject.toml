[project]
name = "commishdesk"
version = "0.0.1"
description = "An automated weekly newspaper for a Sleeper fantasy football league — open-source, zero-credential engine."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
commishdesk = "commishdesk.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["commishdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
